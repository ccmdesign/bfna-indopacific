[build]
  # Build command for SSG
  command = "npm run generate"
  # The directory containing the static files to deploy
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

# Embed routes: allow iframe embedding from any origin via CSP frame-ancestors
# MUST appear BEFORE the /* catch-all rule
[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self)"

# All other routes: deny iframe embedding
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; frame-src 'self'"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self)"

# BF-224: no SPA fallback. Every public route is prerendered (strait deep links
# included), and the old `/* → /index.html 200` rule served the hub page — with its
# embed-code buttons — for any unknown URL, including inside a host site's iframe.
# Missing paths now get Nuxt's generated 404.html with a real 404 status.
